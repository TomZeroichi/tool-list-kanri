  const keyForWeek = () => { const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

  function monthly(){const g=goalFor(state.selectedMonth),m=state.selectedMonth,p=phaseFor(m),a=getActual(m),tasks=Array.isArray(state.tasks[m])?state.tasks[m]:[];return `<div class="page-head"><div><div class="eyebrow">MONTHLY TRACKER</div><h1>月別目標・実績管理</h1><p>毎月の販売結果と行動タスクを記録します</p></div></div><div class="month-strip">${MONTHS.map(x=>`<button data-month="${x.m}" class="month-tab ${m===x.m?'active':''}">${x.m}ヶ月目</button>`).join('')}</div><section class="card month-hero"><div><span class="chip">STEP ${p.no}｜${p.period}</span><h2>${m}ヶ月目の目標</h2><p>${esc(p.label)} ／ 評価目標 ${fmt(g.rating)}件</p></div><div><small style="color:#d9e9ff">月間純利益</small><div class="month-goal">${man(g.profit)}</div></div></section><div class="section-head"><div><h2>今月の数値目標</h2><p>月20稼働日で計算しています</p></div></div><div class="grid3"><div class="target-box"><small>新規出品</small><strong>${fmt(g.list)}品 <span class="hint"> / ${g.list/20}品/日</span></strong></div><div class="target-box"><small>月間販売件数</small><strong>${fmt(g.sales)}件</strong></div><div class="target-box"><small>平均純利益</small><strong>${yen(g.unit)}</strong></div><div class="target-box"><small>販売者評価・累計</small><strong>${fmt(g.rating)}件</strong></div><div class="target-box"><small>リサーチ</small><strong>${fmt(g.research)}商品</strong></div><div class="target-box"><small>概算有効出品数</small><strong>${fmt(targetActive(m))}品</strong></div></div><div class="section-head"><div><h2>実績を入力</h2><p>保存すると概要やグラフにも反映されます</p></div></div><section class="card"><form id="actual-form"><div class="input-grid">${[['profit','実際の月間純利益（円）'],['list','実際の新規出品数（品）'],['sales','実際の販売件数（件）'],['rating','実際の評価累計（件）'],['research','実際のリサーチ件数（件）'],['active','現在の有効出品数（品）']].map(([k,l])=>`<label class="form-field"><span>${l}</span><input name="${k}" type="number" ${k==='profit'?'':'min=\"0\"'} step="1" inputmode="numeric" placeholder="未入力" value="${hasActual(m,k)?esc(a[k]):''}"></label>`).join('')}</div><label class="form-field" style="margin-top:15px"><span>月次振り返り・改善メモ</span><textarea name="notes" placeholder="売れ筋、改善点、翌月の重点などをメモ">${esc(a.notes||'')}</textarea></label><div class="form-actions"><button type="submit" class="btn">この月の実績を保存</button><span id="save-status" class="save-message" role="status"></span></div></form></section><div class="section-head"><div><h2>今月の実行チェックリスト</h2><p>タスクをタップして完了記録</p></div><span class="tag">${tasks.length}/${g.tasks.length} 完了</span></div><section class="card"><ul class="month-tasks">${g.tasks.map((t,i)=>`<li class="month-task ${tasks.includes(i)?'done':''}"><input type="checkbox" data-task="${i}" id="month-task-${i}" ${tasks.includes(i)?'checked':''}><label for="month-task-${i}">${esc(t)}</label></li>`).join('')}</ul>${progress(tasks.length,g.tasks.length)}</section><details class="card" style="margin-top:17px"><summary style="font-weight:900;cursor:pointer">この月の目標値をカスタマイズする</summary><p class="hint" style="margin:10px 0 14px">現在の挑戦目標を変更できます。利益目標は「販売件数×1件あたり純利益」で再計算します。</p>${targetInputs(g)}</details><div class="notice orange" style="margin-top:18px"><strong>出品数の考え方：</strong>新規出品数と販売中の商品数は別管理です。商品が売れると有効出品数は減ります。販売・出品取消・再出品・複数在庫数により実際の件数は変わります。</div>`;}
  function stages(){return `<div class="page-head"><div><div class="eyebrow">GROWTH ROADMAP</div><h1>4ステップの事業成長計画</h1><p>STEP3は7〜9ヶ月、STEP4は10〜12ヶ月です</p></div></div><div class="notice" style="margin-bottom:20px"><strong>ロードマップ：</strong>まず販売の基礎と評価を獲得 → 売れ筋と外注体制を確立 → 組織運営を仕組み化 → 月利100万円の事業モデルを目指します。</div>${PHASES.map(p=>`<section class="card stage-section" id="stage-${p.no}"><div class="stage-header"><div class="stage-circle">${p.no}</div><div><div class="eyebrow">STEP ${p.no}　/　${p.period}</div><h2>${esc(p.label)} <span style="color:#086cdd;font-size:17px">｜目標 月利${man(p.profit)}突破</span></h2><div class="sub">評価目標：${p.feedback}件以上</div></div></div><p style="font-size:14px;color:#4d6283">${esc(p.summary)}</p><ul class="list-dots">${p.missions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="scroll-table"><table class="plan-table"><thead><tr><th>月</th><th>新規出品</th><th>販売件数</th><th>平均純利益</th><th>月利目標</th><th>評価累計</th></tr></thead><tbody>${p.months.map(m=>{const x=goalFor(m);return `<tr class="${m===+state.selectedMonth?'sel':''}"><td><button class="link-button" data-month="${m}" data-open="monthly">${m}ヶ月目 →</button></td><td>${fmt(x.list)}品</td><td>${fmt(x.sales)}件</td><td>${yen(x.unit)}</td><td><strong>${man(x.profit)}</strong></td><td>${fmt(x.rating)}件</td></tr>`;}).join('')}</tbody></table></div></section>`).join('')}<section class="card"><h2 style="font-size:18px">最初に検証する商品カテゴリー</h2><p class="hint">送料・手数料・需要を調べ、採算の合う商品だけ採用します。</p><div class="stage-photos">${PRODUCT_TYPES.map(x=>`<div class="product-card"><div class="product-emoji">${x[0]}</div><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div></section><section class="card" style="margin-top:18px"><h2 style="font-size:18px">継続して守る運用方針</h2><ul class="list-dots"><li>仕入れ・販売・国際送料・手数料・広告・外注費を記録し、純利益で判断</li><li>100均商品は単品赤字に注意し、セット販売や小型軽量商品を検証</li><li>eBayの販売済みデータを見てから商品を仕入れる</li><li>評価件数だけでなく発送遅延、欠品キャンセル、返品率を確認する</li><li>無在庫はeBayのドロップシッピングポリシーに沿った仕入れ体制で運用する</li><li>月利100万円達成後は3ヶ月連続維持を次の経営目標にする</li></ul></section>`;}
  function computeFinance(){const f=state.finance;const x={};Object.keys(initial().finance).forEach(k=>x[k]=nonneg(f[k]));x.profit=x.price-x.cost-x.shipping-x.fees-x.ads-x.packing-x.outsource-x.other;x.margin=x.price?x.profit/x.price*100:0;return x;}
  function finance(){const f=computeFinance();return `<div class="page-head"><div><div class="eyebrow">PROFIT SIMULATOR</div><h1>1商品あたりの利益計算</h1><p>海外送料・手数料・外注費まで入れて、販売目標を逆算</p></div></div><div class="split"><section class="card calc-card"><h3>利益計算に使う金額</h3><p class="hint" style="margin-bottom:18px">販売価格とコストを日本円で入力してください。変更内容は自動保存されます。</p><div class="input-grid">${[['price','販売総額（受取送料込み）'],['cost','商品仕入れ原価'],['shipping','国際送料'],['fees','eBay・決済・為替関連費'],['ads','広告費'],['packing','梱包資材費'],['outsource','外注費'],['other','返品引当・その他経費']].map(([k,l])=>`<label class="form-field"><span>${l}（円）</span><input data-finance="${k}" type="number" min="0" step="1" value="${f[k]}" inputmode="numeric"></label>`).join('')}</div><div class="form-actions"><button class="btn secondary" id="reset-finance">計算例に戻す</button></div></section><div><section class="calc-summary"><small>1商品あたりの純利益</small><div class="big ${f.profit<0?'warn':''}" id="calc-profit">${yen(f.profit)}</div><div style="font-size:13px">利益率 ${f.margin.toFixed(1)}% ／ 原価・経費を控除した金額</div><div class="calc-metrics"><div><span>月利10万円</span><strong>${f.profit>0?`${fmt(Math.ceil(100000/f.profit))}件`:'—'}</strong></div><div><span>月利50万円</span><strong>${f.profit>0?`${fmt(Math.ceil(500000/f.profit))}件`:'—'}</strong></div><div><span>月利100万円</span><strong>${f.profit>0?`${fmt(Math.ceil(1000000/f.profit))}件`:'—'}</strong></div></div></section><section class="card" style="margin-top:16px"><h3>1件あたりの内訳</h3><table class="plan-table finance-table" style="min-width:0;width:100%;margin-top:8px"><tbody>${[['販売総額',f.price],['仕入れ',-f.cost],['国際送料',-f.shipping],['eBay・決済費',-f.fees],['広告費',-f.ads],['梱包費',-f.packing],['外注費',-f.outsource],['その他',-f.other],['純利益',f.profit]].map(([name,num],i)=>`<tr><td>${i===8?'<strong>':''}${name}${i===8?'</strong>':''}</td><td style="${i===8?'font-weight:950;color:#075fce':''}">${num<0?'-':''}${yen(Math.abs(num))}</td></tr>`).join('')}</tbody></table></section><div class="notice orange" style="margin-top:15px"><strong>注意：</strong>この計算は概算です。販売カテゴリーや取引条件、関税の負担者、為替、返品率、固定費によって実際の利益は変わります。数字を確認してから仕入れてください。</div></div></div>`;}
  function settings(){const key=keyForWeek();return `<div class="page-head"><div><div class="eyebrow">SETTINGS & BACKUP</div><h1>設定・データ管理</h1><p>データのバックアップ、週間チェック、使い方の確認</p></div></div><div class="grid2"><section class="card"><h2 style="font-size:18px">データのバックアップ</h2><p style="font-size:13px;color:#586e8a;margin:8px 0 16px">記録はブラウザ内に保存されます。端末変更・ブラウザデータ削除に備え、定期的にバックアップしてください。</p><div class="form-actions"><button class="btn" id="export-json">JSONを保存</button><button class="btn secondary" id="import-json">JSONから復元</button><input type="file" accept=".json,application/json" id="import-file" class="hide" aria-label="バックアップJSONファイルを選択"></div></section><section class="card"><h2 style="font-size:18px">アプリについて</h2><p style="font-size:13px;color:#586e8a;margin:9px 0">TOM eBay Growth v${VERSION}</p><p style="font-size:13px;color:#586e8a">①ファイルを展開して index.html を開くと基本機能が使えます。②HTTPSのサイトに配置するとPWAとしてホーム画面に追加でき、オフラインで利用可能になります。</p><p class="hint" style="margin-top:12px">クラウド同期はありません。複数端末を使う場合はJSONで移行してください。</p></section></div><div class="section-head"><div><h2>週間チェックリスト</h2><p>今週（${esc(key)}開始）の10項目</p></div></div>${weeklyCard(true)}<div class="section-head"><div><h2>計画の注意点</h2><p>利益と出品数を正しく管理するためのルール</p></div></div><div class="card"><ul class="list-dots"><li>各月20稼働日で想定。1日あたりの出品数は「月の目標÷20」で表示</li><li>新規出品数と有効出品数を別々に記録</li><li>販売者評価は「累計」で入力。購入者全員が評価するとは限りません</li><li>月利は税引前・事業経費控除後の数字で入力</li><li>仕入れ先・商品構成・外注人数は利益率と回転率に応じて柔軟に調整</li></ul><div class="form-actions"><button id="reset-all" class="btn danger">すべての記録を初期化する</button></div></div>`;}
  const views={home,monthly,phases:stages,finance,settings};
  function render(){root.innerHTML=layout(views[state.tab]());attach();}
  function go(tab){state.tab=tab;save();render();window.scrollTo({top:0,behavior:'instant'});}
  function setMonth(month,open){state.selectedMonth=Math.min(12,Math.max(1,Number(month)||1));if(open)state.tab=open;save();render();window.scrollTo({top:0,behavior:'instant'});}
  function flash(msg){const el=document.getElementById('save-status');if(el)el.textContent=msg;}
  function attach(){
    root.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.tab)));
    root.querySelectorAll('[data-month]').forEach(el=>el.addEventListener('click',()=>setMonth(el.dataset.month,el.dataset.open)));
    root.querySelectorAll('[data-phase]').forEach(el=>el.addEventListener('click',()=>{const stage=el.dataset.phase;go('phases');document.getElementById(`stage-${stage}`)?.scrollIntoView({behavior:'smooth',block:'start'});}));
    document.getElementById('global-month')?.addEventListener('change',e=>setMonth(e.target.value));
    root.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('change',()=>{const m=state.selectedMonth,idx=Number(el.dataset.task);let arr=Array.isArray(state.tasks[m])?[...state.tasks[m]]:[];arr=el.checked?[...new Set([...arr,idx])]:arr.filter(i=>i!==idx);state.tasks[m]=arr;save();render();}));
    root.querySelectorAll('[data-week]').forEach(el=>el.addEventListener('change',()=>{const k=keyForWeek(),idx=Number(el.dataset.week);let arr=Array.isArray(state.weekly[k])?[...state.weekly[k]]:[];arr=el.checked?[...new Set([...arr,idx])]:arr.filter(i=>i!==idx);state.weekly[k]=arr;save();render();}));
    document.getElementById('reset-week')?.addEventListener('click',()=>{if(confirm('今週のチェックをすべて未完了に戻しますか？')){state.weekly[keyForWeek()]=[];save();render();}});
    document.getElementById('actual-form')?.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget),m=state.selectedMonth;const a={};['profit','list','sales','rating','research','active'].forEach(k=>{const v=fd.get(k);if(v!==''&&v!==null)a[k]=k==='profit'?signed(v):nonneg(v);});a.notes=String(fd.get('notes')||'').slice(0,10000);state.actuals[m]=a;if(save()){flash('保存しました ✓');} });
    document.getElementById('save-goals')?.addEventListener('click',()=>{const m=state.selectedMonth,o={};root.querySelectorAll('[data-goal-field]').forEach(el=>{o[el.dataset.goalField]=nonneg(el.value);});state.overrides[m]=o;if(save())render();});
    document.getElementById('reset-goals')?.addEventListener('click',()=>{if(confirm('この月の目標を初期値に戻しますか？実績は残ります。')){delete state.overrides[state.selectedMonth];save();render();}});
    root.querySelectorAll('[data-finance]').forEach(el=>el.addEventListener('change',e=>{state.finance[e.target.dataset.finance]=nonneg(e.target.value);save();render();}));
    document.getElementById('reset-finance')?.addEventListener('click',()=>{state.finance=initial().finance;save();render();});
    document.getElementById('export-json')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({...state,version:VERSION,exportedAt:new Date().toISOString()},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`TOM_eBay_Growth_backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);});
    document.getElementById('import-json')?.addEventListener('click',()=>document.getElementById('import-file')?.click());
    document.getElementById('import-file')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2e6)throw Error('ファイルサイズが大きすぎます');const obj=JSON.parse(await file.text());if(!obj||typeof obj!=='object'||obj.version===undefined||typeof obj.actuals!=='object'||typeof obj.tasks!=='object')throw Error('TOM eBay Growthのバックアップ形式ではありません');if(!confirm('現在の記録を選択したバックアップで上書きしますか？'))return;state={...initial(),...obj,actuals:safeObject(obj.actuals),overrides:safeObject(obj.overrides),tasks:safeObject(obj.tasks),weekly:safeObject(obj.weekly),finance:{...initial().finance,...safeObject(obj.finance)}};state.tab='home';state.selectedMonth=Math.max(1,Math.min(12,Number(state.selectedMonth)||1));save();render();alert('バックアップを復元しました。');}catch(err){alert('復元できませんでした：'+err.message);}finally{e.target.value='';}});
    document.getElementById('reset-all')?.addEventListener('click',()=>{if(confirm('全12ヶ月の実績・タスク・カスタマイズ目標を初期化します。復元できません。続けますか？')&&confirm('本当に初期化しますか？先にJSONバックアップをおすすめします。')){state=initial();save();render();}});
  }
  render();
  if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
